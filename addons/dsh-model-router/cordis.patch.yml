        #     - { id: <ID>, provider: <ROUTE>, model: <MODEL_ID>, strengths: '...' }       # an explicit route
        #   routingModel: { provider: <ROUTE>, model: <MODEL_ID> }
        #   policy: { stickyTurns: 2, minConfidence: 0.6, defaultCandidate: <ID>, respectHealth: true }
        candidates: []
