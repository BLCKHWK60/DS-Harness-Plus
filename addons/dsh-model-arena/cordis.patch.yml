- insert:
    - id: model-arena
      name: '@local/dsh-model-arena'
      config:
        # Does nothing until you pick models: use Settings > Arena, or list them here. Example shape:
        #   candidates:
        #     - { id: <ID>, provider: <ROUTE>, model: <MODEL ID>, reasoningEffort: <EFFORT> }
        #   maxContestants: 4                       # 2 to 4 answers per round
        #   judge: { provider: <ROUTE>, model: <MODEL ID> }        # needed only for `/arena judge`
        #   criteria: [<CRITERION>, ...]            # empty = a generic set
        #   dataDir: <ABSOLUTE_DIR>                 # optional; default is a folder in the dsh home
        candidates: []
