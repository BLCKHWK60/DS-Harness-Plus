- insert:
    - id: bench
      name: '@local/dsh-bench'
      config:
        # Off until you switch it on in Settings > Devices. It then adds a Devices tab beside Chat, Cowork and Code.
        # Needs the Modes add-on and the Cowork sidebar. Optional:
        #   folder: <FOLDER>   # where cards and logbooks are kept; empty: bench in the app's data folder
        enabled: false
        # Danger zone, off by default (Settings > Devices): writes that can damage a device without the
        # backup and source conditions.
        allowRiskyWrites: false
