- insert:
    - id: settings-plus
      name: '@local/dsh-settings-plus'
      config:
        # Groups, icons and a search field in the Settings window. Switch off under Plugins to go back to the plain list.
        enabled: true
        # The small gear beside Send that opens the current mode's settings in a popup.
        modeGear: true
        # The Export button beside the gear: this conversation as a file (Markdown, text, HTML, JSON) at three levels.
        exportButton: true
        # A mode's own extra buttons (Devices rules, Creator Plus, Focus, Finance, Recon's Export) sit in the gear's popup, not in the chat box.
        extrasInGear: true
        # Which settings list the Settings window starts with: simple (about ten settings) or advanced (every page). A first install starts on simple.
        view: advanced
        # True only on a first install, until the first-run setup card is finished or put away.
        setupPending: false
